services:
  - type: web
    name: vartest-webservice
    runtime: node
    rootDir: webservice
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: PORT
        value: 10000

  - type: web
    name: vartest-static
    runtime: static
    rootDir: static-site
    buildCommand: npm install && node build.js
    staticPublishPath: dist
    envVars:
      - key: WEBSERVICE_ID
        fromService:
          name: vartest-webservice
          type: web
          property: RENDER_SERVICE_ID
