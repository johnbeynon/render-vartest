          envVarKey: RENDER_DISCOVERY_SERVICE
      - key: SRC_RENDER_EXTERNAL_HOSTNAME
        fromService:
          name: vartest-webservice
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: SRC_RENDER_EXTERNAL_URL
        fromService:
