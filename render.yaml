services:
  - type: web
    name: vartest-webservice
    runtime: node
    rootDir: webservice
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: PORT
        value: 10000

  - type: web
    name: vartest-webservice-2
    runtime: node
    rootDir: webservice
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: PORT
        value: 10000
      - key: SRC_IS_PULL_REQUEST
        fromService:
          name: vartest-webservice
          type: web
          envVarKey: IS_PULL_REQUEST
